<!doctype html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      * {
        font-family: arial;
      }
      body {
        margin-top: 0;
        margin-bottom: 0;
      }
      .app-container {
        display: flex;
        flex-direction: column;
        max-width: 600px;
        height: 100vh;
        margin-left: auto;
        margin-right: auto;
      }
      .chat-input-container {
        display: flex;
        align-items: start;
      }
      .send-button {
        background-color: rgb(25, 135, 84);
        color: white;
        font-size: 15px;
        border: none;
        border-radius: 10px;
        padding: 12px 20px;
        margin-left: 10px;
        cursor: pointer;
      }
      .chat-input {
        font-size: 15px;
        border-style: solid;
        border-radius: 10px;
        padding: 12px 15px;
        border-width: 1px;
        margin-bottom: 60px;
        flex-grow: 1;
      }
      .chat-messages-container {
        flex-grow: 1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;
      }
      .chat-message-user {
        display: flex;
        justify-content: end;
        align-items: start;
      }
      .chat-message-robot {
        display: flex;
        align-items: start;
      }
      .chat-message-text {
        background-color: rgb(238, 238, 238);
        padding: 15px 20px;
        border-radius: 10px;
        margin-right: 10px;
        margin-left: 10px;
        margin-bottom: 20px;
        max-width: 300px;
      }
      .chat-message-profile {
        width: 45px;
      }
      .welcome-container {
        display: flex;
        text-align: center;
        height: 100vh;
        align-items: center;
        justify-content: center;
        color: rgb(150, 150, 150);
      }
      .loading-spinner {
        height: 40px;
        margin: -15px;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput({ chatMessages, setChatMessages }) {
        const [inputText, setInputText] = React.useState("");
        const [isLoading, setIsLoading] = React.useState(false);

        function saveInputText(event) {
          setInputText(event.target.value);
        }

        async function sendMessage() {
          if (inputText !== "" && !isLoading) {
            const newChatMessages = [
              ...chatMessages,
              {
                message: inputText,
                sender: "user",
                id: crypto.randomUUID(),
              },
            ];
            setIsLoading(true);
            setChatMessages(newChatMessages);
            setInputText("");

            setChatMessages([
              ...newChatMessages,
              {
                message: (
                  <img src="loading-spinner.gif" class="loading-spinner" />
                ),
                sender: "robot",
                id: crypto.randomUUID(),
              },
            ]);

            const response = await Chatbot.getResponseAsync(inputText);

            setChatMessages([
              ...newChatMessages,
              {
                message: response,
                sender: "robot",
                id: crypto.randomUUID(),
              },
            ]);
            setIsLoading(false);
          }
        }

        function handleKeyDown(event) {
          if (event.key === "Enter") {
            sendMessage();
          } else if (event.code === "Escape") {
            setInputText("");
          }
        }
        return (
          <div className="chat-input-container">
            <input
              placeholder="Send a message to Chatbot"
              size="30"
              onChange={saveInputText}
              value={inputText}
              onKeyUp={handleKeyDown}
              className="chat-input"
            />
            <button onClick={sendMessage} className="send-button">
              Send
            </button>
          </div>
        );
      }

      function ChatMessage({ message, sender }) {
        //const message = props.message;
        //const sender = props.sender;
        //const { message, sender } = props;
        /*
        if (sender === "robot") {
          return (
            <div>
              <img src="robot.png" alt="robot profile" width="50" />
              {message}
            </div>
          );
        }
        */
        return (
          <div
            className={
              sender === "user" ? "chat-message-user" : "chat-message-robot"
            }
          >
            {sender === "robot" && (
              <img
                src="robot.png"
                alt="robot profile"
                className="chat-message-profile"
              />
            )}
            <div className="chat-message-text">{message}</div>
            {sender === "user" && (
              <img
                src="user.png"
                alt="user profile"
                className="chat-message-profile"
              />
            )}
          </div>
        );
      }

      function ChatMasseges({ chatMessages }) {
        const chatMessagesRef = useAutoScroll([chatMessages]);

        if (chatMessages.length === 0) {
          return (
            <div className="welcome-container">
              Welcome to the chatbot project! send a message using the textbox
              below.
            </div>
          );
        }
        return (
          <div className="chat-messages-container" ref={chatMessagesRef}>
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                  key={chatMessage.id}
                />
              );
            })}
          </div>
        );
      }

      function useAutoScroll(dependencies) {
        const containerRef = React.useRef(null);
        React.useEffect(() => {
          const containerElem = containerRef.current;
          if (containerElem) {
            containerElem.scrollTop = containerElem.scrollHeight;
          }
        }, dependencies);
        return containerRef;
      }

      function App() {
        // we can have component inside a component

        const [chatMessages, setChatMessages] = React.useState([
          /*
          {
            message: "hello chatbot",
            sender: "user",
            id: "id1",
          },
          {
            message: "Hello! How can I help you?",
            sender: "robot",
            id: "id2",
          },
          {
            message: "can you get me todays date?",
            sender: "user",
            id: "id3",
          },
          {
            message: "Today is September 27",
            sender: "robot",
            id: "id4",
          },
          */
        ]);

        //const [chatMessages, setChatMessages] = array;
        //const chatMessages = array[0];
        //const setChatMessages = array[1];

        return (
          <div className="app-container">
            <ChatMasseges chatMessages={chatMessages} />
            <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
            />
          </div>
        );
      }

      /* we use component with a function to create it instead of a const
      const app = (
        <>
          <ChatInput />
          <ChatMessage message="hello chatbot" sender="user" />
          <ChatMessage message="Hello! How can I help you?" sender="robot" />
          <ChatMessage message="can you get me todays date?" sender="user" />
          <ChatMessage message="Today is September 27" sender="robot" />
        </>
      );
      */
      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
